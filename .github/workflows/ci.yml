# Continuous integration: tests, lint, security checks and both frontend builds.
#
# Needs no database, LLM or iDEAL repository: the suite uses stand-ins for all of
# them (see tests/test_db_layer.py). That also means it proves the Python logic
# only - real Oracle execution and real data are verified separately.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DV_NLP_WARMUP: "false"          # never load the 1.3 GB embedding model in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU-only torch keeps this fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend tests dev_server.py
      - name: Tests
        run: python -m pytest
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
        continue-on-error: true         # advisory until the findings are triaged
      - name: Static security scan
        run: bandit -q -r backend -ll
        continue-on-error: true         # advisory until the findings are triaged

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build iDEAL 6.0
        run: npm run build:60
      - name: Build iDEAL 5.5
        run: npm run build:55
